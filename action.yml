name: 'Setup CI Environment'
description: >-
  Installs oc/uv/helm, logs in to the OpenShift cluster, exports KEY=value
  environment variables for subsequent steps, and runs a pre-flight
  clean-cluster wait (the cross-repo mutex for the shared ROSA cluster).
  Cluster login and the pre-flight check are skipped when no credentials are
  provided, so the action can be dry-run without secrets.

inputs:
  oc_server:
    description: 'OpenShift server URL (leave empty for secret-free dry runs)'
    required: false
    default: ''
  oc_token:
    description: 'OpenShift authentication token (leave empty for secret-free dry runs)'
    required: false
    default: ''
  env:
    description: >-
      Environment variables in KEY=value format (multiline), exported to
      GITHUB_ENV for subsequent steps. Use for config such as NAMESPACE,
      OGX_ENDPOINT, MODEL, ...
    required: false
    default: ''
  namespace:
    description: 'praxis namespace checked by the pre-flight clean-cluster wait'
    required: false
    default: 'praxis-ci'

outputs:
  namespace:
    description: 'praxis namespace to deploy into'
    value: ${{ steps.vars.outputs.namespace }}

runs:
  using: 'composite'
  steps:
    # Nested actions are pinned by full SHA (never movable tags) because these
    # steps run in jobs that hold cluster credentials.
    - name: Install OpenShift CLI
      # redhat-actions/openshift-tools-installer v1
      uses: redhat-actions/openshift-tools-installer@144527c7d98999f2652264c048c7a9bd103f8a82
      with:
        oc: "4.19.24"

    - name: Install uv
      # astral-sh/setup-uv v5
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

    - name: Install Helm
      # azure/setup-helm v4
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
      with:
        # Pinned to Helm v3: Helm v4 removed script post-renderers
        # ("--post-renderer <executable>" fails with "plugin ... not found"),
        # which scripts/deploy.sh relies on.
        version: v3.17.1

    - name: Login to OpenShift cluster
      if: inputs.oc_server != '' && inputs.oc_token != ''
      # redhat-actions/oc-login v1
      uses: redhat-actions/oc-login@5eb45e848b168b6bf6b8fe7f1561003c12e3c99d
      with:
        openshift_server_url: ${{ inputs.oc_server }}
        openshift_token: ${{ inputs.oc_token }}

    - name: Export environment variables
      id: vars
      shell: bash
      env:
        ENV_VARS: ${{ inputs.env }}
        NAMESPACE_INPUT: ${{ inputs.namespace }}
      run: |
        # Parse KEY=value lines into GITHUB_ENV so they survive across steps.
        # Key names are validated (and PATH/GITHUB_* reserved) to keep
        # GITHUB_ENV injection-safe.
        if [ -n "$ENV_VARS" ]; then
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            key="${line%%=*}"
            if [[ "$line" != *=* ]] || [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
              || [[ "$key" == "PATH" ]] || [[ "$key" == GITHUB_* ]]; then
              echo "Invalid env line (expected KEY=value, PATH/GITHUB_* reserved): $line" >&2
              exit 1
            fi
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$ENV_VARS"
        fi
        echo "namespace=$NAMESPACE_INPUT" >> "$GITHUB_OUTPUT"

    - name: Pre-flight cluster check
      if: inputs.oc_server != '' && inputs.oc_token != ''
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: bash "${{ github.action_path }}/.github/scripts/preflight-cluster-clean.sh"
